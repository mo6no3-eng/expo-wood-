<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>木材をつなぐ ― 万博の記憶を集める</title>
<style>
:root{--bg:#fff;--surface:#faf6ef;--lav:#ece6f7;--ink:#2b2433;--sub:#6d6478;--line:#e6dfd3;--acc:#7a5cc2;--wood:#b98b57;--shadow:rgba(43,36,51,.08);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1720;--surface:#262029;--lav:#352c4a;--ink:#f3eee6;--sub:#b3aabd;--line:#3a3342;--acc:#b8a1ee;--wood:#d3a672;--shadow:rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1720;--surface:#262029;--lav:#352c4a;--ink:#f3eee6;--sub:#b3aabd;--line:#3a3342;--acc:#b8a1ee;--wood:#d3a672;--shadow:rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;line-height:1.7;-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:0 auto;padding:16px 20px 96px}
h1{font-size:22px;margin:4px 0 2px;font-weight:700;letter-spacing:.02em}h2{font-size:18px;margin:28px 0 8px}
p{margin:0 0 12px}.sub{color:var(--sub);font-size:14px}
.stage{position:relative;background:linear-gradient(180deg,var(--lav),var(--surface));border-radius:28px;height:340px;overflow:hidden;touch-action:none;margin:14px 0}
.stage canvas{width:100%;height:100%;display:block}
.hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:12px;color:var(--sub);pointer-events:none}
.gauge{display:flex;align-items:center;gap:18px;background:var(--surface);border-radius:24px;padding:16px 20px}
.ring{width:84px;height:84px;flex:none;position:relative}.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px}
.bar{height:8px;background:var(--lav);border-radius:8px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--acc);border-radius:8px;transition:width .6s}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:14px 22px;background:var(--acc);color:#fff;font-weight:600;min-height:48px}
button.ghost{background:var(--lav);color:var(--ink)}button.wide{width:100%}
button:focus-visible{outline:3px solid var(--wood);outline-offset:2px}
.row{display:flex;gap:10px;margin-top:14px}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:8px 14px;border-radius:999px;background:var(--surface);font-size:13px;border:1px solid var(--line)}
.chip.on{background:var(--wood);color:#fff;border-color:var(--wood)}
.card{background:var(--surface);border-radius:24px;padding:18px 20px;margin:12px 0}
.card img{width:100%;border-radius:16px;display:block;margin-bottom:12px}.card svg{width:100%;height:auto;border-radius:16px;display:block;margin-bottom:12px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav div{display:flex;width:100%;max-width:480px;gap:4px}
nav button{flex:1;background:none;color:var(--sub);padding:8px 4px;font-size:12px;border-radius:14px;min-height:52px}
nav button.on{background:var(--lav);color:var(--ink)}
video{width:100%;border-radius:24px;background:#000;aspect-ratio:3/4;object-fit:cover}
.qr{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);color:var(--ink);border-radius:18px;padding:12px 14px;margin-top:8px;font-weight:500}
.qr span.q{width:40px;height:40px;flex:none;background:repeating-conic-gradient(var(--ink) 0 25%,var(--bg) 0 50%) 0 0/10px 10px;border-radius:6px}
.qr small{display:block;color:var(--sub);font-weight:400}
.qr.done{opacity:.55}
.ov{position:fixed;inset:0;background:rgba(30,20,45,.6);display:none;place-items:center;z-index:9;padding:24px}
.ov.on{display:grid}.ov .box{background:var(--bg);border-radius:28px;padding:28px 24px;text-align:center;max-width:360px;animation:pop .5s}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:10;display:none}
</style>
</head>

<div id="app"></div>
<nav><div id="nav"></div></nav>

function illus(hl){const h=hl?`<rect x="${hl[0]}" y="${hl[1]}" width="${hl[2]}" height="${hl[3]}" rx="3" fill="#7a5cc2" opacity=".5"/>`:"";
const ar=(x,y,w,hh)=>`<path d="M${x} ${y+hh} V${y+w/2} A${w/2} ${w/2} 0 0 1 ${x+w} ${y+w/2} V${y+hh}Z" fill="#8a7560"/>`;
return `<svg viewBox="0 0 200 170" role="img" aria-label="イタリア館の図"><rect width="200" height="170" fill="#ece6f7"/>
<rect x="0" y="150" width="200" height="12" fill="#d8cdb8"/>
<rect x="62" y="96" width="76" height="54" fill="#e8dfcf"/>
${[0,1,2,3,4,5].map(k=>ar(66+k*12,122,7,26)).join("")}${[0,1,2,3,4,5,6].map(k=>ar(65+k*10.5,100,6,17)).join("")}
${[0,1,2,3,4,5,6,7].map(k=>`<rect x="${18+k*23}" y="48" width="5" height="102" fill="#cdb48a"/>`).join("")}
<rect x="4" y="46" width="192" height="5" fill="#b8996a"/><rect x="4" y="34" width="192" height="12" fill="#d9bf94"/>${h}</svg>`}

// ---- 3Dモデル ----
let T,renderer,scene,camera,pivot,solids=[],ghosts=[],anims={},dragging=false,idle=0,rotY=.6,rotX=.25,canvasHost;
const WOOD=[0xd8cdb8,0xcdb48a,0xcaa972,0xe3d0a8,0,0];
function mesh(g,c){return new THREE.Mesh(g,new THREE.MeshLambertMaterial({color:c}))}
function ring(G,y0,h,n,aw,ah){const R=2.6,cy=mesh(new THREE.CylinderGeometry(R,R,h,40,1,true),0xe8dfcf);cy.material.side=THREE.DoubleSide;cy.position.y=y0+h/2;G.add(cy);
 const sh=new THREE.Shape();sh.moveTo(-aw/2,0);sh.lineTo(-aw/2,ah-aw/2);sh.absarc(0,ah-aw/2,aw/2,Math.PI,0,true);sh.lineTo(aw/2,0);sh.closePath();const gm=new THREE.ShapeGeometry(sh);
 for(let k=0;k<n;k++){const a=k/n*Math.PI*2,m=new THREE.Mesh(gm,new THREE.MeshBasicMaterial({color:0x7a6650,side:THREE.DoubleSide}));m.position.set(Math.sin(a)*(R+.02),y0+(h-ah)/2,Math.cos(a)*(R+.02));m.rotation.y=a;G.add(m)}}
function build(i){const G=new THREE.Group(),c=WOOD[i];
 if(i==0){const m=mesh(new THREE.BoxGeometry(14,.2,9),0xd8cdb8);m.position.y=.1;G.add(m)}
 if(i==1){[-5.4,-3.6,-1.8,0,1.8,3.6,5.4].forEach(x=>[-3.4,3.4].forEach(z=>{const m=mesh(new THREE.CylinderGeometry(.14,.14,5.2,10),c);m.position.set(x,2.8,z);G.add(m)}));
  [-6.4,6.4].forEach(x=>{const m=mesh(new THREE.BoxGeometry(.9,5.2,7),c);m.position.set(x,2.8,0);G.add(m)})}
 if(i==2){for(let x=-6;x<=6;x+=1.5){const m=mesh(new THREE.BoxGeometry(.14,.4,8.4),c);m.position.set(x,5.2,0);G.add(m)}
  [-3.4,3.4].forEach(z=>{const m=mesh(new THREE.BoxGeometry(13,.3,.3),c);m.position.set(0,5.25,z);G.add(m)})}
 if(i==3){const m=mesh(new THREE.BoxGeometry(15,.35,9.4),c);m.position.y=5.6;G.add(m)}
 if(i==4)ring(G,.2,2,14,.75,1.5);
 if(i==5)ring(G,2.2,1.6,18,.6,1.1);
 return G}
function ghostOf(g){const G=g.clone(true);G.traverse(o=>{if(o.isMesh)o.material=new THREE.MeshBasicMaterial({color:0x7a5cc2,wireframe:true,transparent:true,opacity:.22})});return G}
function initGL(host){canvasHost=host;
 if(!renderer){renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(40,1,.1,100);camera.position.set(0,6.5,25);camera.lookAt(0,3,0);
  scene.add(new THREE.AmbientLight(0xffffff,.75));const d=new THREE.DirectionalLight(0xffffff,.8);d.position.set(6,12,8);scene.add(d);
  pivot=new THREE.Group();scene.add(pivot);
  PARTS.forEach((p,i)=>{const s=build(i),g=ghostOf(s);pivot.add(g,s);solids.push(s);ghosts.push(g)});
  const c=renderer.domElement;
  c.addEventListener("pointerdown",e=>{dragging=true;idle=0;c.setPointerCapture(e.pointerId)});
  c.addEventListener("pointermove",e=>{if(dragging){rotY+=e.movementX*.01;rotX=Math.max(-.1,Math.min(.8,rotX+e.movementY*.006))}});
  ["pointerup","pointercancel"].forEach(n=>c.addEventListener(n,()=>{dragging=false}));
  loop()}
 host.prepend(renderer.domElement);resize();sync()}
function resize(){if(!canvasHost||!renderer)return;const w=canvasHost.clientWidth,h=canvasHost.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener("resize",resize);
function sync(){PARTS.forEach((p,i)=>{const on=got.includes(p.id);solids[i].visible=on&&!anims[i];ghosts[i].visible=!on&&!anims[i]})}
function dropIn(i){anims[i]=0;solids[i].visible=true;ghosts[i].visible=false}
function loop(){requestAnimationFrame(loop);if(!renderer.domElement.isConnected)return;
 if(!dragging){idle++;if(idle>120)rotY+=.004}
 pivot.rotation.y=rotY;pivot.rotation.x=rotX*.4;pivot.position.y=-1.2;
 for(const k in anims){anims[k]+=.03;const t=Math.min(anims[k],1),e=1-Math.pow(1-t,3);solids[k].position.y=(1-e)*6;if(t>=1){delete anims[k];solids[k].position.y=0}}
 renderer.render(scene,camera)}

// ---- 画面 ----
let tab="home",cur=null,stream=null,scanning=false;
const NAV=[["home","🏠","ホーム"],["scan","📷","読み取る"],["guide","🏛️","建築解説"]];
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2200)}
function go(t,p){stopCam();tab=t;cur=p||null;render()}
function renderNav(){$("#nav").innerHTML=NAV.map(([k,i,l])=>`<button class="${tab==k||(tab=="info"&&k=="scan")?"on":""}" data-t="${k}"><div style="font-size:18px;display:block">${i}</div>${l}</button>`).join("");
 document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>go(b.dataset.t))}
function gauge(){const p=pct(),C=2*Math.PI*34;
 return `<div class="gauge"><div class="ring"><svg width="84" height="84"><circle cx="42" cy="42" r="34" fill="none" stroke="var(--lav)" stroke-width="9"/><circle cx="42" cy="42" r="34" fill="none" stroke="var(--acc)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p/100)}" style="transition:stroke-dashoffset .6s"/></svg><b>${p}%</b></div>
 <div style="flex:1"><div><b>${got.length}</b> / ${PARTS.length} 個を収集</div><div class="sub">${got.length==PARTS.length?"完成しました":"あと"+(PARTS.length-got.length)+"個で完成"}</div><div class="bar"><i style="width:${p}%"></i></div></div></div>`}
function render(){renderNav();const a=$("#app");
 if(tab=="home"){a.innerHTML=`<h1>${BUILDING.name}を、木材から組み立てる</h1><p class="sub">屋台のQRコードを読み取って、万博の木材を集めましょう。</p>
 <div class="stage" id="stage"><div class="hint">ドラッグで回転 ・ 紫の線はまだ集めていない部分</div></div>${gauge()}
 <div class="row"><button class="wide" id="goScan">QRコードを読み取る</button>${got.length==PARTS.length?'<button class="ghost" id="saveImg">画像を保存</button>':""}</div>
 <h2>集めた木材</h2><div class="chips">${PARTS.map(p=>`<span class="chip ${got.includes(p.id)?"on":""}">${p.name}</span>`).join("")}</div>
 <p class="sub" style="margin-top:18px"><a href="#" id="reset" style="color:var(--sub)">収集状況をリセット</a></p>`;
  initGL($("#stage"));$("#goScan").onclick=()=>go("scan");
  $("#reset").onclick=e=>{e.preventDefault();got=[];save();render()};
  const s=$("#saveImg");if(s)s.onclick=saveImage}
 else if(tab=="scan"){a.innerHTML=`<h1>QRコードを読み取る</h1><p class="sub">屋台のQRコードにカメラを向けてください。</p>
 <div id="camBox"><div class="row"><button class="wide" id="camBtn">カメラを起動する</button></div></div>
 <h2>サンプルQRで試す</h2><p class="sub">カメラが使えない場合は、こちらを選んでください。</p>
 ${PARTS.map(p=>`<button class="qr ${got.includes(p.id)?"done":""}" data-id="${p.id}"><span class="q"></span><span>${p.stall.split("：")[0]}<small>${p.name}${got.includes(p.id)?"（収集済み）":""}</small></span></button>`).join("")}`;
  $("#camBtn").onclick=startCam;document.querySelectorAll(".qr").forEach(b=>b.onclick=()=>handle(b.dataset.id))}
 else if(tab=="info"){const p=PARTS.find(x=>x.id==cur),has=got.includes(p.id);
  a.innerHTML=`<h1>${p.name}</h1><p class="sub">${BUILDING.name}の部材</p><div class="card">${illus(p.hl)}<p><b>使われていた場所</b><br>${p.where}</p></div>
  <div class="card"><p><b>再利用された木材</b><br>${p.wood} → ${p.stall}</p><p class="sub" style="margin:0">試作用のサンプル情報です。</p></div>
  <div class="card"><p><b>建築物の特徴</b><br>${BUILDING.design}</p></div>
  ${has?`<button class="wide ghost" id="back">ホームで3Dモデルを見る</button>`:`<button class="wide" id="add">3Dモデルに追加する</button>`}`;
  const ad=$("#add");if(ad)ad.onclick=()=>add(p.id);$("#back")&&($("#back").onclick=()=>go("home"))}
 else{a.innerHTML=`<h1>${BUILDING.name}</h1><p class="sub">${BUILDING.en}</p><div class="card"><img src="${PHOTO}" alt="イタリア館の完成イメージ"><p>${BUILDING.about}</p></div>
 <h2>設計と特徴</h2><p>${BUILDING.design}</p><h2>使われていた木材</h2><p>屋根・柱・梁・床・円形建築のアーチなど、建物のあちこちに木材が使われました。</p>
 <h2>いまの姿</h2><p>${BUILDING.reuse}</p><div class="card"><p><b>部材ごとの行き先</b></p>${PARTS.map(p=>`<p style="margin:0 0 6px;font-size:14px">${got.includes(p.id)?"✓":"・"} ${p.name} → ${p.stall}</p>`).join("")}</div>
 <p class="sub">※写真はイタリア館の完成イメージです。</p>`}}
function handle(code){const p=PARTS.find(x=>x.id==String(code).trim());
 if(!p){toast("この屋台のQRコードは対象外です");return}
 if(got.includes(p.id))toast("この木材は収集済みです");go("info",p.id)}
function add(id){if(got.includes(id))return;got.push(id);save();const i=PARTS.findIndex(p=>p.id==id);
 go("home");dropIn(i);toast("3Dモデルに追加しました");
 if(got.length==PARTS.length)setTimeout(()=>$("#ov").classList.add("on"),1300)}
$("#okBtn").onclick=()=>$("#ov").classList.remove("on");
function saveImage(){renderer.render(scene,camera);const l=document.createElement("a");l.download="italian-pavilion.png";l.href=renderer.domElement.toDataURL("image/png");l.click()}

// ---- カメラ ----
async function startCam(){const box=$("#camBox");
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
  box.innerHTML=`<video id="vid" playsinline muted></video><p class="sub" style="margin-top:8px">QRコードを枠内に映してください</p>`;
  const v=$("#vid");v.srcObject=stream;await v.play();scanning=true;const cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});
  (function tick(){if(!scanning)return;if(v.videoWidth){cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);
   const r=jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height);if(r&&PARTS.some(p=>p.id==r.data.trim())){handle(r.data);return}}requestAnimationFrame(tick)})()
 }catch(e){box.innerHTML=`<div class="card"><p>カメラを使えませんでした。下のサンプルQRを選んで体験できます。</p></div>`}}
function stopCam(){scanning=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
render();
</script>
</body>
</html>
